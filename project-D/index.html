<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's a sad rainy day in my world</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #e9eef5;
      font-family: sans-serif;
    }
    #videoWrap {
      display: none;
    }
  </style>
</head>
<body>
  <div id="videoWrap">
    <video id="input_video" playsinline></video>
  </div>

  <script>
    let poseLandmarks = null;
    let targetX = 0.5;
    let smoothX = 0.5;

    let fishes = [];
    let splashes = [];
    let paperNoise = [];

    let avatar;
    let spawnTimer = 0;

    let dropSound1;
    let dropSound2;
    let soundReady = false;
    let lastDropSoundTime = 0;
    const dropSoundCooldown = 90;

    function preload() {
      soundFormats('mp3', 'wav', 'ogg');
      dropSound1 = loadSound('drop1.mp3');
      dropSound2 = loadSound('drop2.mp3');
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);

      avatar = new UmbrellaPerson();

      for (let i = 0; i < 220; i++) {
        paperNoise.push({
          x: random(width),
          y: random(height),
          r: random(8, 42),
          a: random(8, 18)
        });
      }

      setupMediaPipe();
    }

    function draw() {
      drawWatercolorBackground();

      smoothX = lerp(smoothX, targetX, 0.08);
      avatar.update(smoothX);

      spawnFishRain();

      for (let i = fishes.length - 1; i >= 0; i--) {
        let f = fishes[i];
        f.update();
        f.display();

        if (avatar.hitUmbrella(f.x, f.y, f.size)) {
          splashes.push(new Splash(f.x, f.y));
          playRandomDropSound();
          fishes.splice(i, 1);
          continue;
        }

        if (f.y > height - 18) {
          splashes.push(new Splash(f.x, height - 10));
          fishes.splice(i, 1);
        }
      }

      drawGroundWash();
      avatar.display();

      for (let i = splashes.length - 1; i >= 0; i--) {
        splashes[i].update();
        splashes[i].display();
        if (splashes[i].dead) splashes.splice(i, 1);
      }
    }

    function playRandomDropSound() {
      if (!soundReady) return;

      let now = millis();
      if (now - lastDropSoundTime < dropSoundCooldown) return;
      lastDropSoundTime = now;

      let picked = random([dropSound1, dropSound2]);
      if (!picked || !picked.isLoaded()) return;

      picked.stop();
      picked.setVolume(0.35);
      picked.play();
    }

    function mousePressed() {
      userStartAudio();
      soundReady = true;
    }

    function touchStarted() {
      userStartAudio();
      soundReady = true;
      return false;
    }

    function keyPressed() {
      userStartAudio();
      soundReady = true;
    }

    function spawnFishRain() {
      spawnTimer++;
      let density = map(width, 600, 1600, 1, 3, true);

      if (spawnTimer % 6 === 0) {
        for (let i = 0; i < density; i++) {
          fishes.push(new FishDrop(random(width), random(-120, -20)));
        }
      }
    }

    function drawWatercolorBackground() {
      background(236, 241, 247);

      noStroke();
      for (let n of paperNoise) {
        fill(255, 255, 255, n.a);
        ellipse(n.x, n.y, n.r, n.r * random(0.8, 1.3));
      }
    }

    function drawGroundWash() {
      noStroke();

      for (let i = 0; i < 4; i++) {
        fill(210, 220, 235, 14);
        ellipse(width * 0.5, height - 14, width * (0.86 + i * 0.08), 20 + i * 7);
      }

      fill(205, 220, 238, 45);
      rect(0, height - 16, width, 16);

      for (let i = 0; i < 36; i++) {
        let x = noise(frameCount * 0.005 + i * 100) * width;
        let y = height - random(8, 20);
        fill(104, 168, 225, random(30, 75));
        ellipse(x, y, random(2, 7), random(2, 6));
      }
    }

    class FishDrop {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = random(9, 24);
        this.speed = random(2.1, 4.8);

        this.baseDrift = random(-0.5, 0.5);
        this.waveAmp = random(0.5, 1.6);
        this.waveSpeed = random(0.012, 0.03);
        this.waveOffset = random(1000);

        this.alpha = random(80, 155);
        this.bodyW = this.size * random(0.34, 0.46);
        this.bodyH = this.size * random(1.15, 1.7);

        this.color = random([
          [110, 170, 235],
          [90, 160, 220],
          [130, 190, 245],
          [120, 180, 230],
          [145, 205, 245]
        ]);
      }

      update() {
        this.y += this.speed;
        let wave = sin(frameCount * this.waveSpeed + this.waveOffset) * this.waveAmp;
        let secondary = sin(frameCount * (this.waveSpeed * 0.55) + this.waveOffset * 0.7) * 0.35;
        this.x += this.baseDrift + wave + secondary;
      }

      display() {
        let c = this.color;

        push();
        translate(this.x, this.y);
        rotate(sin(frameCount * 0.03 + this.waveOffset) * 0.08);

        noStroke();

        fill(c[0], c[1], c[2], this.alpha * 0.12);
        ellipse(0, this.bodyH * 0.08, this.bodyW * 2.4, this.bodyH * 1.8);

        fill(c[0], c[1], c[2], this.alpha * 0.24);
        ellipse(0, 0, this.bodyW * 1.7, this.bodyH * 1.35);

        fill(c[0], c[1], c[2], this.alpha * 0.14);
        ellipse(-this.bodyW * 0.12, -this.bodyH * 0.04, this.bodyW * 1.45, this.bodyH * 1.05);

        fill(c[0], c[1], c[2], this.alpha * 0.92);
        beginShape();
        vertex(0, -this.bodyH * 0.6);
        bezierVertex(
          this.bodyW * 0.58, -this.bodyH * 0.2,
          this.bodyW * 0.42, this.bodyH * 0.26,
          0, this.bodyH * 0.58
        );
        bezierVertex(
          -this.bodyW * 0.42, this.bodyH * 0.26,
          -this.bodyW * 0.58, -this.bodyH * 0.2,
          0, -this.bodyH * 0.6
        );
        endShape(CLOSE);

        fill(min(c[0] + 10, 255), min(c[1] + 12, 255), min(c[2] + 12, 255), this.alpha * 0.7);
        triangle(
          0, -this.bodyH * 0.78,
          -this.bodyW * 0.68, -this.bodyH * 1.02,
          -this.bodyW * 0.1, -this.bodyH * 0.5
        );
        triangle(
          0, -this.bodyH * 0.78,
          this.bodyW * 0.68, -this.bodyH * 1.02,
          this.bodyW * 0.1, -this.bodyH * 0.5
        );

        fill(255, 255, 255, this.alpha * 0.22);
        ellipse(-this.bodyW * 0.1, -this.bodyH * 0.08, this.bodyW * 0.45, this.bodyH * 0.42);

        fill(40, 80, 120, this.alpha * 0.65);
        ellipse(this.bodyW * 0.1, -this.bodyH * 0.1, 1.8, 1.8);

        pop();
      }
    }

    class Splash {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.life = 28;
        this.dead = false;
        this.parts = [];

        for (let i = 0; i < 7; i++) {
          this.parts.push({
            x: x,
            y: y,
            vx: random(-1.2, 1.2),
            vy: random(-2.2, -0.3),
            r: random(2, 6)
          });
        }
      }

      update() {
        this.life--;
        for (let p of this.parts) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
        }
        if (this.life <= 0) this.dead = true;
      }

      display() {
        noStroke();
        for (let p of this.parts) {
          fill(90, 170, 232, map(this.life, 0, 28, 0, 110));
          ellipse(p.x, p.y, p.r, p.r);
        }
      }
    }

    class UmbrellaPerson {
      constructor() {
        this.x = width * 0.5;
        this.y = height * 0.87;
        this.scale = min(width, height) / 900;
        this.umbrellaRadius = 80 * this.scale;
        this.umbrellaTilt = -0.34;
      }

      update(normX) {
        let margin = 120;
        let mapped = map(normX, 0, 1, width - margin, margin);
        this.x = lerp(this.x, mapped, 0.14);
        this.y = height * 0.87;
        this.scale = min(width, height) / 900;
        this.umbrellaRadius = 80 * this.scale;
      }

      getUmbrellaCenter() {
        return {
          x: this.x - 18 * this.scale,
          y: this.y - 138 * this.scale
        };
      }

      hitUmbrella(fx, fy, fs) {
        let c = this.getUmbrellaCenter();

        let px = fx - c.x;
        let py = fy - c.y;

        let ang = -this.umbrellaTilt;
        let rxp = px * cos(ang) - py * sin(ang);
        let ryp = px * sin(ang) + py * cos(ang);

        if (ryp > 12 * this.scale) return false;
        if (ryp < -this.umbrellaRadius * 0.98) return false;

        let rx = this.umbrellaRadius * 1.04;
        let ry = this.umbrellaRadius * 0.60;

        let insideTopHalf =
          (rxp * rxp) / (rx * rx) + (ryp * ryp) / (ry * ry) <= 1.0 && ryp <= 0;

        if (insideTopHalf) return true;

        let rightTipX = this.umbrellaRadius * 0.88;
        let rightTipY = 0;
        if (dist(rxp, ryp, rightTipX, rightTipY) < fs * 0.6) return true;

        let leftTipX = -this.umbrellaRadius * 0.98;
        let leftTipY = 0;
        if (dist(rxp, ryp, leftTipX, leftTipY) < fs * 0.6) return true;

        return false;
      }

      display() {
        push();
        translate(this.x, this.y);
        scale(this.scale);

        noStroke();

        fill(196, 231, 216, 225);
        beginShape();
        vertex(-18, -88);
        bezierVertex(-34, -56, -35, 8, -33, 78);
        bezierVertex(-22, 78, -12, 78, -2, 78);
        vertex(0, -78);
        endShape(CLOSE);

        beginShape();
        vertex(10, -84);
        bezierVertex(26, -52, 26, 8, 29, 78);
        bezierVertex(18, 78, 8, 78, -2, 78);
        vertex(0, -76);
        endShape(CLOSE);

        fill(174, 215, 194, 110);
        beginShape();
        vertex(-10, -66);
        bezierVertex(-16, -40, -16, 8, -14, 72);
        bezierVertex(-9, 72, -5, 72, -1, 72);
        vertex(0, -62);
        endShape(CLOSE);

        beginShape();
        vertex(7, -62);
        bezierVertex(12, -36, 13, 8, 15, 72);
        bezierVertex(10, 72, 4, 72, -1, 72);
        vertex(0, -58);
        endShape(CLOSE);

        stroke(228, 244, 233, 120);
        strokeWeight(0.9);
        noFill();
        beginShape();
        vertex(-16, -62);
        bezierVertex(-22, -42, -22, 4, -18, 68);
        endShape();

        beginShape();
        vertex(-6, -74);
        bezierVertex(-9, -46, -9, 2, -7, 68);
        endShape();

        beginShape();
        vertex(10, -66);
        bezierVertex(14, -38, 13, 4, 11, 68);
        endShape();

        beginShape();
        vertex(18, -52);
        bezierVertex(18, -30, 16, 4, 12, 68);
        endShape();

        noStroke();
        fill(18, 18, 22);
        beginShape();
        vertex(-6, -80);
        bezierVertex(-8, -50, -8, -22, -6, 0);
        vertex(-4, 18);
        vertex(5, 18);
        vertex(7, -1);
        bezierVertex(7, -22, 6, -50, 4, -80);
        endShape(CLOSE);

        fill(18, 18, 22);
        ellipse(0, -100, 17, 17);

        fill(18, 18, 22);
        arc(-1, -103, 18, 16, PI * 1.05, TWO_PI - 0.2, CHORD);

        stroke(18, 18, 22);
        strokeWeight(2.6);
        noFill();

        beginShape();
        vertex(-4, -72);
        bezierVertex(-10, -64, -12, -48, -10, -30);
        endShape();

        beginShape();
        vertex(7, -74);
        bezierVertex(8, -69, 10, -62, 15, -54);
        endShape();

        noStroke();
        fill(18, 18, 20);
        rect(-5, 18, 4, 60, 4);
        rect(4, 18, 4, 60, 4);

        push();
        translate(-18, -138);
        rotate(this.umbrellaTilt);

        noStroke();
        fill(236, 78, 55, 208);
        ellipse(0, 0, this.umbrellaRadius * 2.18, this.umbrellaRadius * 1.26);

        fill(246, 110, 82, 70);
        ellipse(-8, -5, this.umbrellaRadius * 1.55, this.umbrellaRadius * 0.86);

        stroke(250, 186, 160, 135);
        strokeWeight(1.05);
        for (let a = 0; a < TWO_PI; a += PI / 20) {
          let ex = cos(a) * this.umbrellaRadius;
          let ey = sin(a) * this.umbrellaRadius * 0.58;
          line(0, 0, ex, ey);
        }

        noFill();
        stroke(215, 72, 52, 160);
        strokeWeight(1.35);
        ellipse(0, 0, this.umbrellaRadius * 2.18, this.umbrellaRadius * 1.26);

        stroke(125, 84, 65);
        strokeWeight(2.1);
        line(0, 0, 0, 90);
        noFill();
        arc(8, 84, 18, 15, 0, PI * 0.5);

        pop();
        pop();
      }
    }

    function setupMediaPipe() {
      const videoElement = document.getElementById("input_video");

      const pose = new Pose({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }
      });

      pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      pose.onResults((results) => {
        if (results.poseLandmarks) {
          poseLandmarks = results.poseLandmarks;

          let leftShoulder = poseLandmarks[11];
          let rightShoulder = poseLandmarks[12];
          let leftHip = poseLandmarks[23];
          let rightHip = poseLandmarks[24];

          let validShoulders = leftShoulder && rightShoulder;
          let validHips = leftHip && rightHip;

          let centerX = 0.5;

          if (validShoulders && validHips) {
            centerX = (
              leftShoulder.x +
              rightShoulder.x +
              leftHip.x +
              rightHip.x
            ) / 4;
          } else if (validShoulders) {
            centerX = (leftShoulder.x + rightShoulder.x) / 2;
          }

          targetX = constrain(centerX, 0.05, 0.95);
        }
      });

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      camera.start();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      paperNoise = [];
      for (let i = 0; i < 220; i++) {
        paperNoise.push({
          x: random(width),
          y: random(height),
          r: random(8, 42),
          a: random(8, 18)
        });
      }
    }
  </script>
</body>
</html>
